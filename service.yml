name: chatwoot
icon: chatwoot
type: service
title: Chatwoot
guidance: GUIDANCE.md
scalable: true

labels:
- chatwoot
- rails

options:
- version: '4.17'
  tag: 'v4.17.1'
  default: true

endpoints:
- name: web
  main: true
  ports:
  - name: http
    number: 3000
    protocol: http
    main: true

settings:
- name: account_signup
  title: Account signup
  description: Set to false to disable public account signup or api_only to 
    allow API signup only
  default: 'false'
  var: ENABLE_ACCOUNT_SIGNUP
# The default keeps stack upgrades working: a required setting with no value
# stops the deployment that follows an upgrade. It is used only when no super
# admin exists yet.
- name: admin_email
  title: Admin email
  description: Sign-in email of the first Chatwoot administrator. Replace the 
    placeholder with your own address. Used only when no administrator exists.
  required: true
  default: admin@example.com
  var: CHATWOOT_ADMIN_EMAIL
- name: default_locale
  title: Default locale
  default: en
  var: DEFAULT_LOCALE
- name: force_ssl
  title: Force SSL
  default: 'true'
  var: FORCE_SSL
- name: log_level
  title: Log level
  default: info
  var: LOG_LEVEL
- name: mailer_sender_email
  title: Mailer sender
  description: Sender address used for outbound Chatwoot email
  default: Chatwoot <accounts@chatwoot.com>
  var: MAILER_SENDER_EMAIL
- name: rails_max_threads
  title: Rails threads
  default: '5'
  var: RAILS_MAX_THREADS
- name: sidekiq_concurrency
  title: Sidekiq concurrency
  default: '10'
  var: SIDEKIQ_CONCURRENCY

env:
- name: ACTIVE_STORAGE_SERVICE
  value: local
- name: FRONTEND_URL
  value: 'https://{{service.primaryHost}}'
- name: INSTALLATION_ENV
  value: helm
- name: NODE_ENV
  value: production
- name: RAILS_ENV
  value: production
- name: RAILS_LOG_TO_STDOUT
  value: 'true'
- name: SECRET_KEY_BASE
  value: '{{secret_key_base}}'
- name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
  value: '{{ar_primary_key}}'
- name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
  value: '{{ar_deterministic_key}}'
- name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
  value: '{{ar_key_derivation_salt}}'
- name: CHATWOOT_ADMIN_PASSWORD
  value: '{{admin_password}}'

links:
- name: db
  title: PostgreSQL with pgvector
  required: true
  env:
  - name: DATABASE_URL
    value: '{{link.database.url}}'
    secret: true
  selectors:
  - type: db
    labels:
    - postgres
    - pgvector
- name: redis
  title: Redis
  required: true
  env:
  - name: REDIS_URL
    value: 'redis://:{{link.tokens.password}}@{{link.host}}:{{link.port}}/0'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
- name: storage
  title: Shared attachment storage
  required: true
  selectors:
  - type: storage
- name: sendmail
  title: Mail transfer agent
  required: false
  env:
  - name: SMTP_ADDRESS
    value: '{{link.host}}'
  - name: SMTP_PORT
    value: '{{link.port}}'
  - name: SMTP_ENABLE_STARTTLS_AUTO
    value: 'false'
  selectors:
  - type: service
    labels:
    - smtpd

tokens:
- name: secret_key_base
  generate:
    regex: '[0-9a-f]{64}'
- name: ar_primary_key
  generate:
    regex: '[A-Za-z0-9]{32}'
- name: ar_deterministic_key
  generate:
    regex: '[A-Za-z0-9]{32}'
- name: ar_key_derivation_salt
  generate:
    regex: '[A-Za-z0-9]{32}'
# Chatwoot requires an upper-case letter, a lower-case letter, a number and a
# special character, so the first 16 characters guarantee one group of each.
- name: admin_password
  generate:
    regex: '[A-Z]{4}[a-z]{4}[0-9]{4}[!@#%_-]{4}[A-Za-z0-9!@#%_-]{16}'

volumes:
- name: storage
  title: Attachments
  link: storage
  shared: true
  size: 20
  path: /app/storage

integrations:
- name: variable
  title: Additional Chatwoot environment variables
  type: variable
  required: false
  multiple: true

derivatives:
- name: chatwoot-sidekiq
  icon: chatwoot
  title: Sidekiq
  type: service
  required: true
  default: true
  args:
  - bundle
  - exec
  - sidekiq
  - -C
  - config/sidekiq.yml
  helm:
    values:
    - name: command
      value: []
    - name: service.enabled
      value: false
    - name: containerPorts
      value: []
    - name: startupProbe
      value: ''

deployment:
  strategy: rolling
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 60s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateless
  chart: oci://registry-1.docker.io/wodby/stateless
  version: 0.4.0
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
    strategy: strategy
    minReady: minReadySeconds
    progressDeadline: progressDeadlineSeconds
    shutdownGracePeriod: terminationGracePeriodSeconds
  values:
  - name: containerName
    value: chatwoot
  - name: containerPorts
    value:
    - name: http
      containerPort: 3000
      protocol: TCP
  - name: command
    value:
    - docker/entrypoints/rails.sh
  # The server starts only after the database is prepared, the first
  # administrator exists and the onboarding page is closed, so its first response
  # is never that page. A failure here stops the container before it serves
  # anything. The Sidekiq derivative replaces these args and does not run this.
  - name: args
    value:
    - sh
    - -c
    - bundle exec ruby -e "$1" "$2" && exec bundle exec rails s -p 3000 -b 0.0.0.0
    - sh
    - |
      # Holds a database lock, so web pods starting together take these steps one at a time.
      require 'pg'
      lock = PG.connect(ENV.fetch('DATABASE_URL'))
      lock.exec('SELECT pg_advisory_lock(20261101)')
      [['db:chatwoot_prepare'], ['runner', ARGV.fetch(0)]].each do |task|
        system('bundle', 'exec', 'rails', *task) || exit(1)
      end
    - |
      # Closes the onboarding page first, so no failure below can leave it open.
      Redis::Alfred.delete(Redis::Alfred::CHATWOOT_INSTALLATION_ONBOARDING)
      email = ENV.fetch('CHATWOOT_ADMIN_EMAIL', '').strip.downcase
      if SuperAdmin.exists?
        puts 'A super admin already exists. No administrator created.'
      elsif User.exists?(email: email)
        puts "Warning: #{email} already belongs to a user who is not a super admin. No administrator created."
      else
        AccountBuilder.new(
          account_name: 'Chatwoot',
          user_full_name: 'Administrator',
          email: email,
          user_password: ENV.fetch('CHATWOOT_ADMIN_PASSWORD', ''),
          super_admin: true,
          confirmed: true
        ).perform
        puts "Created the first administrator: #{email}"
      end
  - name: startupProbe
    value:
      httpGet:
        path: /health
        port: http
        # FORCE_SSL redirects plain HTTP; Wodby's routes terminate TLS and send this header.
        httpHeaders:
        - name: X-Forwarded-Proto
          value: https
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
  - name: livenessProbe
    value:
      httpGet:
        path: /health
        port: http
        # FORCE_SSL redirects plain HTTP; Wodby's routes terminate TLS and send this header.
        httpHeaders:
        - name: X-Forwarded-Proto
          value: https
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
  - name: readinessProbe
    value:
      httpGet:
        path: /api
        port: http
        httpHeaders:
        - name: X-Forwarded-Proto
          value: https
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: commonLabels
    annotations: commonAnnotations
    volumes: extraVolumes
    sidecars: extraContainers
  containers:
  - name: chatwoot
    image: chatwoot/chatwoot
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
      image:
        registry: image.registry
        repository: image.repository
        tag: image.tag
        pullPolicy: image.pullPolicy
